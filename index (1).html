<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen Run">
<title>LUMEN RUN 7.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(circle at 50% 0%,#1c2c4d 0%,#0c1220 70%);
 color:white;font-family:"Segoe UI",Arial,sans-serif;
 min-height:100vh;display:flex;
 justify-content:center;align-items:center;
}
.game{width:min(950px,98vw);padding:12px}
h1{
 text-align:center;letter-spacing:8px;margin:6px 0 2px;font-size:34px;
 background:linear-gradient(90deg,#ffe078,#ff9bd0,#7de4ff);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 2px 8px #0008);
}
.hud{
 display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
 margin:12px 0;
}
.stat{
 display:flex;align-items:center;gap:10px;
 padding:9px 12px;border-radius:14px;
 background:linear-gradient(180deg,#24365a,#16223b);
 border:1px solid #ffffff1c;
 box-shadow:0 4px 12px #0006, inset 0 1px 0 #ffffff14;
 min-width:0;
}
.stat svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 3px #0008)}
.stat .txt{display:flex;flex-direction:column;min-width:0;line-height:1.1}
.stat small{font-size:10px;letter-spacing:1.5px;color:#9db2d4}
.stat b{font-size:20px}
.hearts{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.hearts svg{width:18px;height:18px}
.pbar{height:6px;border-radius:4px;background:#0c1424;margin-top:5px;overflow:hidden;width:100%}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6bd68d,#ffe078);transition:width .2s}
.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.25)}}
canvas{
 width:100%;display:block;
 background:#182638;border:2px solid #3a4f72;
 border-radius:16px;
 box-shadow:0 10px 30px #000a;
}
.help{text-align:center;color:#a6b5ca;font-size:13px;padding:12px}
@media(max-width:700px){.hud{grid-template-columns:repeat(3,1fr)}}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none;margin:0 auto;-webkit-touch-callout:none}
.rotate{display:none;text-align:center;font-size:13px;font-weight:bold;color:#ffe078;
 background:#24365a;border-radius:10px;padding:8px;margin:0 0 8px}
.fs{display:none;margin:4px auto 10px;padding:10px 18px;font-size:14px;font-weight:bold;color:white;
 background:linear-gradient(180deg,#4a8dff,#2a5fc0);border:1px solid #ffffff44;border-radius:12px;cursor:pointer}
@media (pointer:coarse){.fs{display:inline-block}}
@media (pointer:coarse) and (orientation:portrait){.rotate{display:block}}
@media (max-height:520px){
 h1,.help,.rotate{display:none!important}
 .game{padding:4px}
 .hud{margin:4px 0;gap:4px}
 .stat{padding:4px 8px;gap:6px;border-radius:10px}
 .stat small{display:none}
 .stat svg{width:20px;height:20px}
 .stat b{font-size:14px}
 .hearts svg{width:14px;height:14px}
 .pbar{margin-top:2px}
}
</style>
</head>
<body>
<div class="game">
<h1>✦ LUMEN RUN ✦</h1>
<div class="hud">
 <div class="stat"><span data-icon="level"></span><div class="txt"><small>NIVEL</small><b id="level">1</b></div></div>
 <div class="stat"><span data-icon="heart"></span><div class="txt"><small>VIDAS</small><div class="hearts" id="hearts"></div></div></div>
 <div class="stat"><span data-icon="star"></span><div class="txt"><small>ESTRELLAS</small><b id="score">0</b></div></div>
 <div class="stat"><span data-icon="coin"></span><div class="txt"><small>MONEDAS</small><b id="coins">0</b></div></div>
 <div class="stat"><span data-icon="trophy"></span><div class="txt"><small>RÉCORD</small><b id="best">0</b></div></div>
 <div class="stat"><span data-icon="target"></span><div class="txt"><small>PROGRESO</small><b id="progress">0/5</b><div class="pbar"><i id="pbar"></i></div></div></div>
</div>
<div class="rotate" id="rotate">📱 Gira el móvil en horizontal para jugar mejor</div>
<canvas id="game" width="900" height="600"></canvas>
<div class="help" id="help">
 WASD / FLECHAS: MOVER · ESPACIO: ESCUDO · ENTER: ACEPTAR · ESC: PAUSA / VOLVER · 1-2-3: COMPRAR EN LA TIENDA
</div>
<div style="text-align:center"><button id="fs" class="fs">⛶ PANTALLA COMPLETA</button></div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=900,H=600;

/* ================== ICONOS DE LA BARRA SUPERIOR ================== */
const ICONS={
 level:'<svg viewBox="0 0 24 24"><path d="M5 22V3" stroke="#cfd8e8" stroke-width="2.5" stroke-linecap="round"/><path d="M6 4h13l-3.5 4.5L19 13H6z" fill="#4c91ff" stroke="#9ec5ff" stroke-width="1.2" stroke-linejoin="round"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.6-8.5-11.4A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8.5 2.6C20.5 15.400 12 21 12 21z" fill="#ff4b6e" stroke="#ffb3c2" stroke-width="1.2"/></svg>',
 heartEmpty:'<svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.6-8.5-11.4A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8.5 2.6C20.5 15.400 12 21 12 21z" fill="#2a3550" stroke="#56688d" stroke-width="1.2"/></svg>',
 star:'<svg viewBox="0 0 24 24"><polygon points="12,2 15,8.800 22,9.500 16.800,14.300 18.400,21.500 12,17.800 5.600,21.500 7.200,14.300 2,9.500 9,8.800" fill="#ffce52" stroke="#fff1b0" stroke-width="1.2" stroke-linejoin="round"/></svg>',
 coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5b72b" stroke="#ffe08a" stroke-width="1.5"/><circle cx="12" cy="12" r="6.500" fill="none" stroke="#c78a10" stroke-width="1.8"/><path d="M12 8v8M10 10.200c0-1 4-1 4 0s-4 2.600-4 3.600 4 1 4 0" fill="none" stroke="#c78a10" stroke-width="1.4" stroke-linecap="round"/></svg>',
 trophy:'<svg viewBox="0 0 24 24"><path d="M7 3h10v6a5 5 0 0 1-10 0z" fill="#ffd24d" stroke="#fff1b0" stroke-width="1.2"/><path d="M7 5H3.500v2a3.500 3.500 0 0 0 3.500 3.500M17 5h3.500v2a3.500 3.500 0 0 1-3.500 3.500" fill="none" stroke="#ffd24d" stroke-width="1.8"/><path d="M12 14v4" stroke="#ffd24d" stroke-width="2"/><rect x="7.500" y="18" width="9" height="3.500" rx="1.200" fill="#c78a10"/></svg>',
 target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#243553" stroke="#7de4ff" stroke-width="1.5"/><circle cx="12" cy="12" r="6" fill="none" stroke="#7de4ff" stroke-width="1.5"/><circle cx="12" cy="12" r="2.200" fill="#ff7282"/></svg>'
};
document.querySelectorAll("[data-icon]").forEach(el=>{
 el.innerHTML=ICONS[el.dataset.icon];
});

const ui={
 level:document.getElementById("level"),
 hearts:document.getElementById("hearts"),
 score:document.getElementById("score"),
 coins:document.getElementById("coins"),
 best:document.getElementById("best"),
 progress:document.getElementById("progress"),
 pbar:document.getElementById("pbar")
};

/* ================== GUARDADO AUTOMÁTICO ================== */
const SAVE_KEY="lumenSave";
let save={coins:0,up:{shield:0,speed:0,life:0},level:1,best:0};

function loadSave(){
 try{
  const raw=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(raw){
   save.coins=Number(raw.coins)||0;
   save.level=Math.max(1,Number(raw.level)||1);
   save.best=Number(raw.best)||0;
   if(raw.up){
    save.up.shield=Number(raw.up.shield)||0;
    save.up.speed=Number(raw.up.speed)||0;
    save.up.life=Number(raw.up.life)||0;
   }
  }
 }catch(e){}
}

function writeSave(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
}

loadSave();

window.addEventListener("beforeunload",writeSave);
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  writeSave();
  if(state==="playing")state="paused";
 }
});
setInterval(writeSave,5000);

/* ================== TIENDA ================== */
const shopItems=[
 {
  id:"shield",icon:"🛡️",name:"Escudo mejorado",max:5,
  desc:n=>"Duración: "+(1.4+n*0.4).toFixed(1)+"s",
  cost:n=>50+n*50
 },
 {
  id:"speed",icon:"⚡",name:"Velocidad",max:5,
  desc:n=>"Velocidad: "+(260+n*25),
  cost:n=>50+n*50
 },
 {
  id:"life",icon:"❤️",name:"Vida extra",max:5,
  desc:n=>"Vidas iniciales: "+(3+n),
  cost:n=>100+n*100
 }
];

function shieldDuration(){return 1.4+save.up.shield*0.4;}
function playerSpeed(){return 260+save.up.speed*25;}
function maxLives(){return 3+save.up.life;}

function buyItem(i){
 const it=shopItems[i];
 if(!it)return;
 const n=save.up[it.id];
 if(n>=it.max){showMessage("¡Ya está al máximo!");return;}
 const c=it.cost(n);
 if(save.coins<c){showMessage("No tienes suficientes monedas");return;}
 save.coins-=c;
 save.up[it.id]++;
 writeSave();
 updateUI();
 showMessage("¡Mejora comprada: "+it.name+"!");
}

/* ================== DATOS ================== */
const themes=[
 {name:"PRADERA",bg:"#182d38",color:"#6bd68d"},
 {name:"VOLCÁN",bg:"#39201e",color:"#ff7043"},
 {name:"TORMENTA",bg:"#20243e",color:"#9d9cff"},
 {name:"HIELO",bg:"#19394c",color:"#75dfff"},
 {name:"DESIERTO",bg:"#493a23",color:"#ffc56b"},
 {name:"OCÉANO",bg:"#123a4c",color:"#43c8ed"},
 {name:"TORNADO",bg:"#293b3c",color:"#a7d8c4"},
 {name:"SOMBRA",bg:"#211b35",color:"#c28aff"},
 {name:"SOL",bg:"#49331e",color:"#ffe078"},
 {name:"CAOS",bg:"#302038",color:"#ff78a8"}
];

const bosses=[
 {name:"IGNIS",title:"SEÑOR DEL FUEGO",color:"#ff543e",hp:12,attack:"fire"},
 {name:"TEMPEST",title:"REY DE LA TORMENTA",color:"#9c9aff",hp:15,attack:"lightning"},
 {name:"GLACIUS",title:"GUARDIÁN DEL HIELO",color:"#6be3ff",hp:18,attack:"ice"},
 {name:"TERRA",title:"TITÁN DE LA TIERRA",color:"#d69b58",hp:20,attack:"earth"},
 {name:"ABYSS",title:"MONSTRUO DEL OCÉANO",color:"#39c9e9",hp:23,attack:"water"},
 {name:"ZEPHYR",title:"SEÑOR DEL VIENTO",color:"#a5e5cb",hp:25,attack:"wind"},
 {name:"UMBRA",title:"REY DE LAS SOMBRAS",color:"#bd85ff",hp:28,attack:"shadow"},
 {name:"SOLARIS",title:"GUARDIÁN SOLAR",color:"#ffe16d",hp:30,attack:"solar"},
 {name:"PHANTOM",title:"EL FANTASMA",color:"#d6d6e8",hp:35,attack:"phantom"},
 {name:"TITÁN",title:"EL JEFE FINAL",color:"#ff6b9d",hp:50,attack:"chaos"}
];

let state="menu";
let shopReturn="menu";
let level=1,lives=3,score=0;
let player,star,enemies=[],projectiles=[],boss=null;
let collected=0;
let shield=0,shieldCooldown=0;
let tutorialStep=0;
let lastTime=0;
let clock=0;
let keys={};
let particles=[];
let attackTimer=0;
let message="";
let messageTimer=0;
let mouse={x:-1,y:-1};
let lostCoins=0,lostUpgrades=0;
let floaters=[],shakeT=0,hurtT=0,bannerT=0,bannerText="",bannerColor="#ffffff";

function floatText(text,x,y,color="#fff"){
 floaters.push({text,x,y,color,t:0});
}

function showBanner(text,color){
 bannerText=text;
 bannerColor=color||"#ffffff";
 bannerT=2.2;
}

/* Los enemigos son más rápidos en cada nivel */
function enemySpeed(){
 return Math.min(100+level*9,600);
}

const tutorial=[
 "¡BIENVENIDO! Usa WASD o las flechas para moverte.",
 "¡BIEN! Ahora recoge las estrellas amarillas.",
 "Cuidado: los monstruos rojos son enemigos.",
 "Pulsa ESPACIO para activar tu escudo temporal.",
 "¡Perfecto! Completa el objetivo para pasar de nivel."
];

/* Niveles progresivos: cada nivel necesita más estrellas */
function starsNeeded(){
 return Math.min(5+Math.floor((level-1)/2),30);
}

function coinsPerStar(){
 return 3+Math.floor(level/5);
}

function heartsHTML(){
 let total=Math.max(maxLives(),lives),html="";
 for(let i=0;i<total;i++){
  html+=i<lives?ICONS.heart:ICONS.heartEmpty;
 }
 return html;
}

let lastUI={};
function pop(el){
 let box=el.closest(".stat");
 box.classList.remove("pop");
 void box.offsetWidth;
 box.classList.add("pop");
}

const tutorialTouch=[
 "¡BIENVENIDO! Arrastra el dedo a la izquierda para moverte.",
 "¡BIEN! Ahora recoge las estrellas amarillas.",
 "Cuidado: los monstruos rojos son enemigos.",
 "Pulsa el botón 🛡 para activar tu escudo temporal.",
 "¡Perfecto! Completa el objetivo para pasar de nivel."
];

function updateUI(){
 const vals={
  level:level,
  score:score,
  coins:save.coins,
  best:Math.max(save.best,score)
 };
 for(const k in vals){
  ui[k].textContent=vals[k];
  if(lastUI[k]!==undefined&&lastUI[k]!==vals[k])pop(ui[k]);
  lastUI[k]=vals[k];
 }
 ui.hearts.innerHTML=heartsHTML();
 if(lastUI.lives!==undefined&&lastUI.lives!==lives)pop(ui.hearts);
 lastUI.lives=lives;
 ui.progress.textContent=isBossLevel()?"JEFE":collected+"/"+starsNeeded();
}

function updateProgressBar(){
 let pct=0;
 if(boss)pct=1-Math.max(0,boss.hp)/boss.maxHp;
 else if(state!=="menu"&&state!=="shop"||player)pct=Math.min(1,collected/starsNeeded());
 if(!player)pct=0;
 ui.pbar.style.width=(pct*100)+"%";
}

function newPlayer(){
 return {x:430,y:420,w:30,h:30,speed:playerSpeed(),fx:0,fy:1,moving:false};
}

function randomStar(){
 return {
  x:65+Math.random()*770,
  y:140+Math.random()*400,
  pulse:0
 };
}

function normalEnemies(){
 let count=Math.min(2+Math.floor(level/3),8);
 enemies=[];

 for(let i=0;i<count;i++){
  enemies.push({
   x:80+Math.random()*700,
   y:150+Math.random()*350,
   w:30,h:30,
   seed:Math.random()*10,
   vx:(Math.random()>.5?1:-1)*enemySpeed()*(.85+Math.random()*.3),
   vy:(Math.random()>.5?1:-1)*enemySpeed()*(.75+Math.random()*.3)
  });
 }
}

function isBossLevel(){
 return level%10===0;
}

function createBoss(){
 let b=bosses[(level/10-1)%bosses.length];
 let extra=Math.floor(Math.max(0,level-100)/10)*5;
 let hp=b.hp+extra;

 boss={
  name:b.name,
  title:b.title,
  color:b.color,
  maxHp:hp,
  hp:hp,
  attack:b.attack,
  x:435,y:145,
  w:90,h:90,
  vx:100,
  phase:0,
  enraged:false,
  basicT:2,
  lastSkill:""
 };

 enemies=[];
 projectiles=[];
 attackTimer=1.5;
}

function startLevel(){
 player=newPlayer();
 star=randomStar();
 projectiles=[];
 particles=[];
 collected=0;
 shield=0;
 shieldCooldown=0;
 tutorialStep=0;

 clearBossStuff();
 floaters=[];

 // Punto de control: el nivel queda guardado
 save.level=level;
 writeSave();

 if(isBossLevel()){
  createBoss();
 }else{
  boss=null;
  normalEnemies();
 }

 state="playing";
 updateUI();

 if(level===1){
  showBanner("¡COMIENZA TU AVENTURA!","#7de4ff");
  showMessage("¡Recoge estrellas y esquiva a los monstruos!");
 }else if(isBossLevel()){
  showBanner("⚠ JEFE: "+boss.name+" ⚠","#ff6b7d");
  showMessage("Estrellas y escudo le hacen daño");
 }else{
  showBanner("NIVEL "+level,"#ffffff");
  showMessage("Enemigos ×"+(enemySpeed()/109).toFixed(1)+" de velocidad");
 }
}

function startGame(fromLevel){
 level=fromLevel||1;
 lives=maxLives();
 score=0;
 startLevel();
}

function nextLevel(){
 level++;
 startLevel();
}

function showMessage(t){
 message=t;
 messageTimer=2;
}

function endRunSave(){
 if(score>save.best)save.best=score;
 writeSave();
}

function damagePlayer(){
 if(shield>0)return;

 lives--;
 shield=1.5;
 shakeT=.35;
 hurtT=.4;
 if(typeof navigator!=="undefined"&&navigator.vibrate){try{navigator.vibrate(90);}catch(e){}}
 floatText("-1 ❤",player.x+15,player.y-10,"#ff6b7d");

 for(let i=0;i<14;i++){
  particles.push({
   x:player.x+15,y:player.y+15,
   vx:(Math.random()-.5)*260,
   vy:(Math.random()-.5)*260,
   life:.6,color:"#ff6b7d"
  });
 }

 updateUI();

 if(lives<=0){
  state="gameover";
  endRunSave();
  // Al perder todas las vidas se reinicia TODO: nivel, monedas y mejoras
  lostCoins=save.coins;
  lostUpgrades=save.up.shield+save.up.speed+save.up.life;
  save.level=1;
  save.coins=0;
  save.up={shield:0,speed:0,life:0};
  clearBossStuff();
  writeSave();
  updateUI();
 }
}

function collision(a,b){
 return a.x<b.x+b.w &&
 a.x+a.w>b.x &&
 a.y<b.y+b.h &&
 a.y+a.h>b.y;
}

function shoot(x,y,speedX,speedY,color="#ff785e",radius=9,extra){
 let p={x,y,vx:speedX,vy:speedY,r:radius,color,t:0};
 if(extra)Object.assign(p,extra);
 projectiles.push(p);
}

/* ================== HABILIDADES DE LOS JEFES ================== */
let hazards=[],minions=[],timers=[];
let darkT=0,gust=null;

function clearBossStuff(){
 hazards=[];minions=[];timers=[];darkT=0;gust=null;
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function mod(v,m){return ((v%m)+m)%m;}
function schedule(t,fn){timers.push({t,fn});}
function bossC(){return boss?{x:boss.x+boss.w/2,y:boss.y+boss.h/2}:null;}
function playerC(){return {x:player.x+15,y:player.y+15};}

function aimFrom(x,y,speed){
 let p=playerC(),dx=p.x-x,dy=p.y-y,l=Math.hypot(dx,dy)||1;
 return {vx:dx/l*speed,vy:dy/l*speed};
}

function ring(x,y,n,speed,off,color,r,extra){
 for(let i=0;i<n;i++){
  let a=off+i*Math.PI*2/n;
  shoot(x,y,Math.cos(a)*speed,Math.sin(a)*speed,color,r,extra?Object.assign({},extra):undefined);
 }
}

function addHazard(h){
 hazards.push(Object.assign({kind:"circle",warn:1,active:.5,age:0,vx:0,vy:0},h));
}

const SK={
 meteors:{name:"☄ LLUVIA DE METEORITOS",cd:2.8,fn:(b,E)=>{
  let n=E?9:6,p=playerC();
  for(let i=0;i<n;i++){
   let x=i===0?p.x:rnd(70,830),y=i===0?p.y:rnd(145,540);
   addHazard({x,y,r:48,warn:1.1+i*.1,active:.45,color:b.color});
  }
 }},
 fireSpiral:{name:"🔥 ESPIRAL DE FUEGO",cd:3,fn:(b,E)=>{
  let waves=E?6:4;
  for(let w=0;w<waves;w++)schedule(w*.35,()=>{
   let c=bossC();if(!c)return;
   ring(c.x,c.y,8,210,w*.4,b.color,10);
  });
 }},
 lightning:{name:"⚡ TORMENTA DE RAYOS",cd:2.6,fn:(b,E)=>{
  let n=E?6:4,p=playerC();
  for(let i=0;i<n;i++){
   let x=i===0?p.x:rnd(80,820);
   addHazard({kind:"rect",x:x-26,y:110,w:52,h:455,warn:.95+i*.12,active:.3,color:b.color});
  }
 }},
 homing:{name:"🔮 ORBE TELEDIRIGIDO",cd:3.2,fn:(b,E)=>{
  let c=bossC();
  for(let i=0;i<(E?2:1);i++){
   shoot(c.x,c.y,rnd(-80,80),90,b.color,15,{home:2.4,speed:150,life:4.5});
  }
 }},
 icicles:{name:"🧊 ESTALACTITAS",cd:2.6,fn:(b,E)=>{
  let n=E?9:6,p=playerC();
  for(let i=0;i<n;i++){
   let x=i<2?p.x+rnd(-40,40):rnd(70,830);
   let y=i<2?p.y+rnd(-40,40):rnd(145,540);
   addHazard({x,y,r:34,warn:.9+i*.07,active:.5,color:b.color,style:"spike"});
  }
 }},
 nova:{name:"❄ NOVA HELADA",cd:3,fn:(b,E)=>{
  let c=bossC();
  ring(c.x,c.y,E?10:8,190,0,b.color,12,{split:{at:.9,n:5,speed:170,r:6}});
 }},
 quake:{name:"🌋 ONDA SÍSMICA (busca el hueco)",cd:3.6,fn:(b,E)=>{
  let n=E?3:2;
  for(let i=0;i<n;i++)schedule(.3+i*.8,()=>{
   let c=bossC();if(!c)return;

const bossSkills={
 fire:["meteors","fireSpiral"],
 lightning:["lightning","homing"],
 ice:["icicles","nova"],
 earth:["quake","pillars"],
 water:["vortex","waves"],
 wind:["tornado","gust"],
 shadow:["clones","darkness"],
 solar:["sunbeam","solarBlast"],
 phantom:["afterimages","orbitals"],
 chaos:["meteors","lightning","quake","vortex","sunbeam","orbitals","nova","homing","clones","pillars","tornado"]
};

function bossAttack(dt){
 if(!boss)return;

 // Fase 2: el jefe se enfurece a mitad de vida
 if(!boss.enraged&&boss.hp<=boss.maxHp/2){
  boss.enraged=true;
  boss.vx*=1.4;
  attackTimer=Math.max(attackTimer,1.2);
  showMessage("🔥 ¡"+boss.name+" SE ENFURECE!");
  return;
 }

 let E=boss.enraged;

 // Disparo básico constante
 boss.basicT-=dt;
 if(boss.basicT<=0){
  let c=bossC(),a=aimFrom(c.x,c.y,230);
  if(E){
   for(let k=-1;k<=1;k++)shoot(c.x,c.y,a.vx+k*60,a.vy,boss.color,9);
  }else{
   shoot(c.x,c.y,a.vx,a.vy,boss.color,9);
  }
  boss.basicT=E?1.4:2;
 }

 attackTimer-=dt;
 if(attackTimer>0)return;

 let list=bossSkills[boss.attack];
 let id;
 do{
  id=list[Math.floor(Math.random()*list.length)];
 }while(list.length>1&&id===boss.lastSkill);
 boss.lastSkill=id;

 let s=SK[id];
 showMessage(s.name);
 s.fn(boss,E);
 attackTimer=s.cd*(E?.75:1)*(boss.attack==="chaos"?.8:1);
}

function updateBossSystems(dt){
 if(darkT>0)darkT-=dt;

 // Acciones programadas
 for(let i=timers.length-1;i>=0;i--){
  timers[i].t-=dt;
  if(timers[i].t<=0){
   let f=timers[i].fn;
   timers.splice(i,1);
   f();
  }
 }

 // Ráfaga de viento
 if(gust){
  player.x+=gust.vx*dt;
  player.y+=gust.vy*dt;
  gust.t-=dt;
  if(gust.t<=0)gust=null;
 }

 // Zonas peligrosas
 for(let i=hazards.length-1;i>=0;i--){
  let h=hazards[i];
  let pc=playerC();
  h.age+=dt;

  if(h.age>=h.warn+h.active){hazards.splice(i,1);continue;}
  if(h.age<h.warn)continue;

  if(h.home){
   let a=aimFrom(h.x,h.y,h.speed),k=Math.min(1,h.home*dt);
   h.vx+=(a.vx-h.vx)*k;
   h.vy+=(a.vy-h.vy)*k;
  }
  h.x+=h.vx*dt;
  h.y+=h.vy*dt;
  if(h.home){h.x=clamp(h.x,50,850);h.y=clamp(h.y,125,550);}
  if(h.follow&&boss){h.x=boss.x+boss.w/2;h.y=boss.y+boss.h/2;}
  if(h.kind==="beam")h.ang+=h.rot*dt;
  if(h.kind==="ring")h.r+=h.grow*dt;

  let hit=false;

  if(h.kind==="circle"){
   hit=Math.hypot(pc.x-h.x,pc.y-h.y)<h.r+10;
  }else if(h.kind==="rect"){
   hit=collision(player,h);
  }else if(h.kind==="ring"){
   let d=Math.hypot(pc.x-h.x,pc.y-h.y);
   if(Math.abs(d-h.r)<h.th/2+10){
    let ang=Math.atan2(pc.y-h.y,pc.x-h.x);
    let diff=Math.atan2(Math.sin(ang-h.gapA),Math.cos(ang-h.gapA));
    hit=Math.abs(diff)>h.gapW/2;
   }
  }else if(h.kind==="beam"){
   let dx=Math.cos(h.ang),dy=Math.sin(h.ang);
   let rx=pc.x-h.x,ry=pc.y-h.y;
   let along=rx*dx+ry*dy,perp=Math.abs(rx*dy-ry*dx);
   hit=along>0&&along<h.len&&perp<h.w/2+10;
  }else if(h.kind==="vortex"){
   let dx=h.x-pc.x,dy=h.y-pc.y,d=Math.hypot(dx,dy)||1;
   if(d<h.r){
    let f=(1-d/h.r)*170+40;
    player.x+=dx/d*f*dt;
    player.y+=dy/d*f*dt;
    hit=d<h.core+10;
   }
  }

  if(hit)damagePlayer();
 }

 // Clones sombríos
 for(let i=minions.length-1;i>=0;i--){
  let m=minions[i];
  m.age+=dt;
  if(m.age>=m.life){minions.splice(i,1);continue;}
  if(m.age>.8){
   m.fire-=dt;
   if(m.fire<=0){
    let cx=m.x+15,cy=m.y+15,a=aimFrom(cx,cy,240);
    shoot(cx,cy,a.vx,a.vy,m.color,10);
    m.fire=1.3;
   }
  }
 }

 player.x=clamp(player.x,35,835);
 player.y=clamp(player.y,110,525);
}

function useShield(){
 if(state==="playing"&&shieldCooldown<=0){
  shield=shieldDuration();
  shieldCooldown=5;
  showMessage("¡ESCUDO ACTIVADO!");
 }
}

function update(dt){
 if(state!=="playing")return;

 if(messageTimer>0)messageTimer-=dt;
 if(shield>0)shield-=dt;
 if(shieldCooldown>0)shieldCooldown-=dt;

 let dx=0,dy=0;

 if(keys.ArrowRight||keys.d||keys.D)dx++;
 if(keys.ArrowLeft||keys.a||keys.A)dx--;
 if(keys.ArrowDown||keys.s||keys.S)dy++;
 if(keys.ArrowUp||keys.w||keys.W)dy--;

 // Joystick táctil (movimiento analógico)
 let joyUsed=false;
 if(joy.id!==null){
  let jl=Math.hypot(joy.dx,joy.dy);
  if(jl>.15){
   let k=Math.min(1,jl/.8)/jl;
   dx=joy.dx*k;
   dy=joy.dy*k;
   joyUsed=true;
  }
 }

 player.moving=!!(dx||dy);
 if(player.moving){player.fx=dx;player.fy=dy;}

 if(dx&&dy&&!joyUsed){
  dx*=.7071;
  dy*=.7071;
 }

 player.x+=dx*player.speed*dt;
 player.y+=dy*player.speed*dt;

 player.x=Math.max(35,Math.min(835,player.x));
 player.y=Math.max(110,Math.min(525,player.y));

 // Tutorial
 if(level===1){
  if(tutorialStep===0&&(dx!==0||dy!==0)){
   tutorialStep=1;
  }

  if(tutorialStep===1&&collected>0){
   tutorialStep=2;
  }

  if(tutorialStep===2&&enemies.some(e=>collision(player,e))){
   tutorialStep=3;
  }

  if(tutorialStep===3&&shield>0){
   tutorialStep=4;
  }
 }

 // Estrella
 star.pulse+=dt;

 let starRect={
  x:star.x-13,y:star.y-13,w:26,h:26
 };

 if(collision(player,starRect)){
  score+=10;
  save.coins+=coinsPerStar();
  floatText("+10 ⭐  +"+coinsPerStar()+" 🪙",star.x,star.y-12,"#ffe078");
  collected++;
  star=randomStar();

  if(boss){
   boss.hp-=3; // En los jefes, cada estrella les hace daño
  }

  updateUI();

  for(let i=0;i<12;i++){
   particles.push({
    x:starRect.x+13,y:starRect.y+13,
    vx:(Math.random()-.5)*180,
    vy:(Math.random()-.5)*180,
    life:.5,color:"#ffcf56"
   });
  }

  if(!isBossLevel()&&collected>=starsNeeded()){
   score+=50;
   save.coins+=10;
   state="levelcomplete";
   endRunSave();
   updateUI();
  }
 }

 // Enemigos normales
 enemies.forEach(e=>{
  e.x+=e.vx*dt;
  e.y+=e.vy*dt;

  if(e.x<35||e.x+e.w>865){
   e.vx*=-1;
   e.x=Math.max(35,Math.min(865-e.w,e.x));
  }

  if(e.y<110||e.y+e.h>565){
   e.vy*=-1;
   e.y=Math.max(110,Math.min(565-e.h,e.y));
  }

  if(collision(player,e)){
   if(shield<=0)damagePlayer();
  }
 });

 // Jefe
 if(boss){
  boss.x+=boss.vx*dt;

  if(boss.x<55||boss.x+boss.w>845){
   boss.vx*=-1;
   boss.x=Math.max(55,Math.min(845-boss.w,boss.x));
  }

  boss.phase+=dt;
  boss.y=130+Math.sin(boss.phase*1.5)*35;

  bossAttack(dt);

  // Con el escudo activo, tocar al jefe le hace daño
  if(collision(player,boss)){
   if(shield>0){
    boss.hp-=12*dt;
   }else{
    damagePlayer();
   }
  }
 }

 updateBossSystems(dt);

 // Proyectiles
 for(let i=projectiles.length-1;i>=0;i--){
  let p=projectiles[i];
  p.t+=dt;

  // Espectros que orbitan al jefe y luego salen disparados
  if(p.delay>0){
   p.delay-=dt;
   p.oa+=dt*3;
   let c=bossC();
   if(c){
    p.x=c.x+Math.cos(p.oa)*p.orb;
    p.y=c.y+Math.sin(p.oa)*p.orb;
   }
   if(p.delay<=0){
    let a=aimFrom(p.x,p.y,p.speed);
    p.vx=a.vx;p.vy=a.vy;
   }
   continue;
  }

  // Proyectiles teledirigidos
  if(p.home){
   let a=aimFrom(p.x,p.y,p.speed),k=Math.min(1,p.home*dt);
   p.vx+=(a.vx-p.vx)*k;
   p.vy+=(a.vy-p.vy)*k;
  }

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;

  // Proyectiles que se dividen
  if(p.split&&p.t>=p.split.at){
   ring(p.x,p.y,p.split.n,p.split.speed,Math.random()*6,p.color,p.split.r);
   projectiles.splice(i,1);
   continue;
  }

  if(p.life&&p.t>=p.life){
   projectiles.splice(i,1);
   continue;
  }

  let hit={
   x:p.x-p.r,y:p.y-p.r,
   w:p.r*2,h:p.r*2
  };

  if(collision(player,hit)){
   if(shield<=0)damagePlayer();
   projectiles.splice(i,1);
   continue;
  }

  if(p.x<-30||p.x>930||p.y<-30||p.y>630){
   projectiles.splice(i,1);
  }
 }

 // Partículas
 particles.forEach(p=>{
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);

 if(boss&&boss.hp<=0){
  score+=200+level*10;
  save.coins+=50+level*2;
  boss=null;
  projectiles=[];
  clearBossStuff();
  state="bosscomplete";
  endRunSave();
  updateUI();
 }
}

/* ================== UTILIDADES DE DIBUJO ================== */
function shade(hex,amt){
 let n=parseInt(hex.slice(1,7),16);
 let r=Math.max(0,Math.min(255,(n>>16)+amt));
 let g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
 let b=Math.max(0,Math.min(255,(n&255)+amt));
 return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function pill(text,x,y,size=20,color="white"){
 ctx.font="bold "+size+"px Arial";
 let w=ctx.measureText(text).width+40;
 rounded(x-w/2,y-size-6,w,size+16,(size+16)/2,"#0b1322cc");
 ctx.fillStyle=color;
 ctx.textAlign="center";
 ctx.fillText(text,x,y);
}

function drawBackground(){
 let theme=themes[Math.floor((level-1)/10)%themes.length];

 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,shade(theme.bg,22));
 g.addColorStop(1,shade(theme.bg,-18));
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 // Zona de juego
 ctx.fillStyle="#00000030";
 ctx.beginPath();
 ctx.roundRect(35,110,830,455,14);
 ctx.fill();

 ctx.fillStyle="#ffffff14";
 for(let x=55;x<865;x+=40){
  for(let y=130;y<565;y+=40){
   ctx.fillRect(x,y,2,2);
  }
 }

 // Partículas flotantes del mundo
 for(let i=0;i<36;i++){
  let sp=10+(i%5)*6;
  let mx=35+mod(i*97.3+Math.sin(clock*.4+i)*30,830);
  let my=110+mod(i*53.7-clock*sp,455);
  ctx.globalAlpha=Math.max(0,.25+.2*Math.sin(clock*2+i));
  ctx.fillStyle=theme.color;
  ctx.beginPath();
  ctx.arc(mx,my,1.5+(i%3)*.8,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;

 ctx.save();
 ctx.shadowColor=theme.color;
 ctx.shadowBlur=14;
 ctx.strokeStyle=theme.color+"cc";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.roundRect(35,110,830,455,14);
 ctx.stroke();
 ctx.restore();

 // Viñeta
 let v=ctx.createRadialGradient(W/2,H/2,200,W/2,H/2,560);
 v.addColorStop(0,"#0000");
 v.addColorStop(1,"#00000055");
 ctx.fillStyle=v;
 ctx.fillRect(0,0,W,H);

 ctx.fillStyle=theme.color;
 ctx.font="bold 13px Arial";
 ctx.textAlign="left";
 ctx.fillText("MUNDO: "+theme.name,45,88);
}

/* ================== AVATARES ================== */
function drawPlayer(){
 let p=player;
 let cx=p.x+15,cy=p.y+15;
 let bob=Math.sin(clock*(p.moving?14:4))*(p.moving?1.8:1);

 // Sombra
 ctx.fillStyle="#00000044";
 ctx.beginPath();
 ctx.ellipse(cx,p.y+34,13,4,0,0,Math.PI*2);
 ctx.fill();

 // Escudo
 if(shield>0){
  let pulse=1+Math.sin(clock*10)*.06;
  ctx.beginPath();
  ctx.arc(cx,cy,28*pulse,0,Math.PI*2);
  let sg=ctx.createRadialGradient(cx,cy,10,cx,cy,30);
  sg.addColorStop(0,"#62cfff10");
  sg.addColorStop(1,"#62cfff66");
  ctx.fillStyle=sg;
  ctx.fill();
  ctx.strokeStyle="#9eeaff";
  ctx.lineWidth=2.5;
  ctx.stroke();
 }

 ctx.save();
 ctx.translate(0,bob);

 // Antena
 ctx.strokeStyle="#a9c8ff";
 ctx.lineWidth=2.5;
 ctx.beginPath();
 ctx.moveTo(cx,p.y+1);
 ctx.lineTo(cx+Math.sin(clock*5)*2,p.y-7);
 ctx.stroke();
 ctx.save();
 ctx.shadowColor="#ffe078";
 ctx.shadowBlur=12;
 ctx.fillStyle="#ffe078";
 ctx.beginPath();
 ctx.arc(cx+Math.sin(clock*5)*2,p.y-9,4,0,Math.PI*2);
 ctx.fill();
 ctx.restore();

 // Piececitos
 ctx.fillStyle="#2a5db8";
 ctx.beginPath();
 ctx.roundRect(p.x+4,p.y+27,9,6,3);
 ctx.roundRect(p.x+17,p.y+27,9,6,3);
 ctx.fill();

 // Cuerpo
 ctx.save();
 ctx.shadowColor="#4c91ff";
 ctx.shadowBlur=14;
 let bg=ctx.createLinearGradient(0,p.y,0,p.y+30);
 bg.addColorStop(0,"#7cb4ff");
 bg.addColorStop(1,"#3a73e0");
 ctx.fillStyle=bg;
 ctx.beginPath();
 ctx.roundRect(p.x,p.y,30,30,10);
 ctx.fill();
 ctx.restore();

 // Brillo
 ctx.fillStyle="#ffffff40";
 ctx.beginPath();
 ctx.roundRect(p.x+4,p.y+3,14,5,3);
 ctx.fill();

 // Ojos
 let blink=(clock%3.4)<.12;
 let ox=Math.max(-1,Math.min(1,p.fx))*1.8;
 let oy=Math.max(-1,Math.min(1,p.fy))*1.5;

 for(const ex of [p.x+9,p.x+21]){
  if(blink){
   ctx.strokeStyle="#16305a";
   ctx.lineWidth=2;
   ctx.beginPath();
   ctx.moveTo(ex-4,p.y+13);
   ctx.lineTo(ex+4,p.y+13);
   ctx.stroke();
  }else{
   ctx.fillStyle="white";
   ctx.beginPath();
   ctx.ellipse(ex,p.y+13,4.8,5.5,0,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle="#16305a";
   ctx.beginPath();
   ctx.arc(ex+ox,p.y+13.5+oy,2.6,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle="white";
   ctx.fillRect(ex+ox-1,p.y+11.5+oy,1.5,1.5);
  }
 }

 // Mejillas y sonrisa
 ctx.fillStyle="#ff9bb866";
 ctx.beginPath();
 ctx.arc(p.x+5,p.y+21,3,0,Math.PI*2);
 ctx.arc(p.x+25,p.y+21,3,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#16305a";
 ctx.lineWidth=2;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.arc(cx,p.y+19,5,.15*Math.PI,.85*Math.PI);
 ctx.stroke();

 ctx.restore();
}

function drawEnemies(){
 enemies.forEach(e=>{
  let bob=Math.sin(clock*8+e.seed)*2;
  let cx=e.x+15,cy=e.y+15;

  // Aura
  let ag=ctx.createRadialGradient(cx,cy,6,cx,cy,28);

   ctx.arc(ex,e.y+13,5,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle="#2a0a12";
   ctx.beginPath();
   ctx.arc(ex+ox,e.y+13+oy,2.6,0,Math.PI*2);
   ctx.fill();
  }

  // Cejas
  ctx.strokeStyle="#4a0d1a";
  ctx.lineWidth=2.5;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(e.x+3,e.y+5);ctx.lineTo(e.x+13,e.y+9);
  ctx.moveTo(e.x+27,e.y+5);ctx.lineTo(e.x+17,e.y+9);
  ctx.stroke();

  // Boca con dientes
  ctx.fillStyle="#3a0814";
  ctx.beginPath();
  ctx.roundRect(e.x+7,e.y+21,16,6,3);
  ctx.fill();
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.moveTo(e.x+9,e.y+21);ctx.lineTo(e.x+12,e.y+25);ctx.lineTo(e.x+15,e.y+21);
  ctx.moveTo(e.x+15,e.y+21);ctx.lineTo(e.x+18,e.y+25);ctx.lineTo(e.x+21,e.y+21);
  ctx.fill();

  ctx.restore();
 });
}

function drawStar(){
 let x=star.x,y=star.y;
 let r=13+Math.sin(star.pulse*5)*2;

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(Math.sin(star.pulse*2)*.4);

 ctx.shadowColor="#ffce52";
 ctx.shadowBlur=22;

 let g=ctx.createRadialGradient(0,-3,2,0,0,r);
 g.addColorStop(0,"#fff4b8");
 g.addColorStop(1,"#ffb92e");
 ctx.fillStyle=g;
 ctx.strokeStyle="#fff1b0";
 ctx.lineWidth=1.5;

 ctx.beginPath();

 for(let i=0;i<10;i++){
  let a=i*Math.PI/5-Math.PI/2;
  let radius=i%2===0?r:r*.45;
  let px=Math.cos(a)*radius;
  let py=Math.sin(a)*radius;

  if(i===0)ctx.moveTo(px,py);
  else ctx.lineTo(px,py);
 }

 ctx.closePath();
 ctx.fill();
 ctx.stroke();
 ctx.restore();
}

function drawSwirl(x,y,r){
 ctx.strokeStyle="#ffffffaa";
 ctx.lineWidth=2.5;
 for(let k=0;k<3;k++){
  ctx.beginPath();
  for(let t=0;t<=1;t+=.05){
   let a=t*6+clock*6+k*2.1,rr=r*t;
   let px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
   if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();
 }
}

function drawHazards(){
 hazards.forEach(h=>{
  let warn=h.age<h.warn;
  let prog=warn?Math.min(1,h.age/h.warn):1;
  let col=h.color;

  ctx.save();

  if(h.kind==="circle"){
   if(warn){
    ctx.strokeStyle=col+"cc";
    ctx.lineWidth=2;
    ctx.setLineDash([8,6]);
    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=col+"33";
    ctx.beginPath();ctx.arc(h.x,h.y,h.r*prog,0,Math.PI*2);ctx.fill();
   }else{
    ctx.shadowColor=col;
    ctx.shadowBlur=25;
    let g=ctx.createRadialGradient(h.x,h.y,2,h.x,h.y,h.r);
    g.addColorStop(0,"#ffffffdd");
    g.addColorStop(.5,col+"dd");
    g.addColorStop(1,col+"55");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    if(h.style==="tornado")drawSwirl(h.x,h.y,h.r);
    if(h.style==="spike"){
     ctx.fillStyle="#ffffffcc";
     for(let k=0;k<6;k++){
      let a=k*Math.PI/3;
      ctx.beginPath();
      ctx.moveTo(h.x+Math.cos(a-.2)*h.r*.5,h.y+Math.sin(a-.2)*h.r*.5);
      ctx.lineTo(h.x+Math.cos(a)*h.r*1.15,h.y+Math.sin(a)*h.r*1.15);
      ctx.lineTo(h.x+Math.cos(a+.2)*h.r*.5,h.y+Math.sin(a+.2)*h.r*.5);
      ctx.fill();
     }
    }
   }
  }

  else if(h.kind==="rect"){
   ctx.beginPath();ctx.rect(35,110,830,455);ctx.clip();
   if(warn){
    ctx.fillStyle=col+"33";
    ctx.fillRect(h.x,h.y,h.w,h.h);
    ctx.strokeStyle=col+"cc";
    ctx.lineWidth=2;
    ctx.setLineDash([10,8]);
    ctx.strokeRect(h.x,h.y,h.w,h.h);
    ctx.setLineDash([]);
   }else{
    ctx.shadowColor=col;
    ctx.shadowBlur=28;
    ctx.fillStyle=col+"e0";
    ctx.fillRect(h.x,h.y,h.w,h.h);
    ctx.shadowBlur=0;
    ctx.fillStyle="#ffffffaa";
    ctx.fillRect(h.x+h.w*.3,h.y,h.w*.4,h.h);
   }
  }

  else if(h.kind==="ring"){
   ctx.shadowColor=col;
   ctx.shadowBlur=22;
   ctx.strokeStyle=col;
   ctx.lineWidth=h.th;
   ctx.beginPath();
   ctx.arc(h.x,h.y,h.r,h.gapA+h.gapW/2,h.gapA+Math.PI*2-h.gapW/2);
   ctx.stroke();
   ctx.shadowBlur=0;
   ctx.strokeStyle="#ffffffaa";
   ctx.lineWidth=3;
   ctx.beginPath();
   ctx.arc(h.x,h.y,h.r,h.gapA+h.gapW/2,h.gapA+Math.PI*2-h.gapW/2);
   ctx.stroke();
  }

  else if(h.kind==="beam"){
   ctx.translate(h.x,h.y);
   ctx.rotate(h.ang);
   if(warn){
    ctx.strokeStyle=col+"cc";
    ctx.lineWidth=2;
    ctx.setLineDash([12,8]);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(h.len,0);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=col+"22";
    ctx.fillRect(0,-h.w/2,h.len,h.w);
   }else{
    ctx.shadowColor=col;
    ctx.shadowBlur=30;
    let g=ctx.createLinearGradient(0,-h.w/2,0,h.w/2);
    g.addColorStop(0,col+"00");
    g.addColorStop(.5,"#ffffffff");
    g.addColorStop(1,col+"00");
    ctx.fillStyle=col+"aa";
    ctx.fillRect(0,-h.w/2,h.len,h.w);
    ctx.fillStyle=g;
    ctx.fillRect(0,-h.w/2,h.len,h.w);
   }
  }

  else if(h.kind==="vortex"){
   if(warn){
    ctx.strokeStyle=col+"cc";
    ctx.lineWidth=2;
    ctx.setLineDash([8,6]);
    ctx.beginPath();ctx.arc(h.x,h.y,h.r*prog,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
   }else{
    let g=ctx.createRadialGradient(h.x,h.y,h.core,h.x,h.y,h.r);
    g.addColorStop(0,col+"99");
    g.addColorStop(1,col+"08");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fill();
    drawSwirl(h.x,h.y,h.r);
    ctx.fillStyle="#05101a";
    ctx.shadowColor=col;
    ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(h.x,h.y,h.core,0,Math.PI*2);ctx.fill();
   }
  }

  ctx.restore();
 });
}

  centerText("¡JEFE DERROTADO!",205,35,"#ffda72");
  centerText("Has conseguido una victoria épica",250,17);
  centerText("+"+(200+level*10)+" ⭐ · +"+(50+level*2)+" 🪙",283,17);
  centerText("🪙 Monedas: "+save.coins,313,15,"#ffd76b");
  centerButton("SIGUIENTE NIVEL",335,nextLevel);
  centerButton("🛒 TIENDA",398,()=>openShop("bosscomplete"),"#2f9e5c");
  primaryAction=nextLevel;
 }

 if(state==="gameover"){
  panel();
  centerText("💔 FIN DE PARTIDA",195,38,"#ff7282");
  centerText("Puntuación: "+score+"   ·   Llegaste al nivel "+level,240,17);
  centerText("Se reinicia TODO tu progreso: empiezas de cero con ❤❤❤ (3 vidas)",272,14,"#ffb3bd");
  centerText("Pierdes el nivel, "+lostCoins+" 🪙 y "+lostUpgrades+" mejoras compradas",298,14,"#ffd76b");
  centerButton("VOLVER A JUGAR",335,()=>startGame(1));
  centerButton("MENÚ PRINCIPAL",398,goMenu,"#5a6c8c");
  primaryAction=()=>startGame(1);
 }

 if(state==="shop"){
  drawShop();
 }
}

function drawFloaters(){
 floaters.forEach(f=>{
  let k=f.t/1.1;
  ctx.globalAlpha=Math.max(0,1-k*k);
  ctx.font="bold 18px Arial";
  ctx.textAlign="center";
  ctx.lineWidth=4;
  ctx.strokeStyle="#000a";
  ctx.strokeText(f.text,f.x,f.y-k*40);
  ctx.fillStyle=f.color;
  ctx.fillText(f.text,f.x,f.y-k*40);
 });
 ctx.globalAlpha=1;
}

function drawBanner(){
 if(bannerT<=0||state!=="playing")return;
 let a=Math.min(1,bannerT/.6,(2.2-bannerT)/.25);
 let sc=1+(1-Math.min(1,(2.2-bannerT)/.3))*.4;

 ctx.save();
 ctx.globalAlpha=Math.max(0,a);
 ctx.translate(W/2,330);
 ctx.scale(sc,sc);

 let g=ctx.createLinearGradient(-W/2,0,W/2,0);
 g.addColorStop(0,"#00000000");
 g.addColorStop(.2,"#000000cc");
 g.addColorStop(.8,"#000000cc");
 g.addColorStop(1,"#00000000");
 ctx.fillStyle=g;
 ctx.fillRect(-W/2,-45,W,90);

 ctx.font="bold 44px Arial";
 ctx.textAlign="center";
 ctx.shadowColor=bannerColor;
 ctx.shadowBlur=22;
 ctx.fillStyle=bannerColor;
 ctx.fillText(bannerText,0,15);
 ctx.restore();
}

function drawHurt(){
 let a=0;
 if(hurtT>0)a=Math.max(a,hurtT/.4*.55);
 if(lives===1&&state==="playing")a=Math.max(a,.18+Math.sin(clock*6)*.1);
 if(a<=0)return;

 let g=ctx.createRadialGradient(W/2,H/2,250,W/2,H/2,560);
 g.addColorStop(0,"#ff000000");
 g.addColorStop(1,"#ff2038");
 ctx.save();
 ctx.globalAlpha=a;
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);
 ctx.restore();
}

function drawEnemyBadge(){
 if(isBossLevel())return;
 let mult=enemySpeed()/109;
 let txt="👾 Enemigos ×"+mult.toFixed(1);

 ctx.font="bold 13px Arial";
 let w=ctx.measureText(txt).width+24;
 rounded(865-w,68,w,26,13,"#0b1322cc");
 ctx.fillStyle=mult>=3?"#ff7282":mult>=1.8?"#ffb86b":"#9fe6a8";
 ctx.textAlign="right";
 ctx.fillText(txt,853,86);
}

function drawMiniStar(x,y,r){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(clock);
 ctx.shadowColor="#ffce52";
 ctx.shadowBlur=12;
 ctx.fillStyle="#ffce52";
 ctx.beginPath();
 for(let i=0;i<10;i++){
  let a=i*Math.PI/5-Math.PI/2;
  let rad=i%2===0?r:r*.45;
  if(i===0)ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);
  else ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
 }
 ctx.closePath();
 ctx.fill();
 ctx.restore();
}

function circlePath(x,y,r){
 ctx.beginPath();
 ctx.arc(x,y,r,0,Math.PI*2);
}

function drawTouchControls(){
 // Joystick
 let active=joy.id!==null;
 let bx=active?joy.bx:JOY_X,by=active?joy.by:JOY_Y;

 ctx.save();
 ctx.globalAlpha=active?.95:.45;
 circlePath(bx,by,JOY_R);
 ctx.fillStyle="#0b1322aa";
 ctx.fill();
 ctx.strokeStyle="#9ec5ffcc";
 ctx.lineWidth=3;
 ctx.stroke();

 ctx.fillStyle="#9ec5ff99";
 ctx.font="bold 14px Arial";
 ctx.textAlign="center";
 ctx.fillText("▲",bx,by-JOY_R+18);
 ctx.fillText("▼",bx,by+JOY_R-8);
 ctx.fillText("◀",bx-JOY_R+14,by+5);
 ctx.fillText("▶",bx+JOY_R-14,by+5);

 let kx=bx+joy.dx*JOY_R*.8,ky=by+joy.dy*JOY_R*.8;
 let kg=ctx.createRadialGradient(kx-6,ky-6,3,kx,ky,30);
 kg.addColorStop(0,"#b9d6ff");
 kg.addColorStop(1,"#3a73e0");
 circlePath(kx,ky,28);
 ctx.fillStyle=kg;
 ctx.fill();
 ctx.strokeStyle="#ffffffaa";
 ctx.lineWidth=2;
 ctx.stroke();
 ctx.restore();

 // Botón de escudo
 let ready=shieldCooldown<=0;
 ctx.save();
 ctx.globalAlpha=ready?.92:.55;
 let sg=ctx.createLinearGradient(0,SB.y-SB.r,0,SB.y+SB.r);
 sg.addColorStop(0,ready?"#62cfff":"#4d6a8a");
 sg.addColorStop(1,ready?"#2a5fc0":"#2a3550");
 circlePath(SB.x,SB.y,SB.r);
 ctx.fillStyle=sg;
 ctx.fill();
 ctx.strokeStyle="#ffffffcc";
 ctx.lineWidth=3;
 ctx.stroke();
 ctx.fillStyle="white";
 ctx.font="34px Arial";
 ctx.textAlign="center";
 ctx.fillText("🛡",SB.x,SB.y+8);
 ctx.font="bold 11px Arial";
 ctx.fillText(ready?"ESCUDO":"RECARGA",SB.x,SB.y+32);
 if(!ready){
  ctx.beginPath();
  ctx.arc(SB.x,SB.y,SB.r+7,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-shieldCooldown/5));
  ctx.strokeStyle="#62cfff";
  ctx.lineWidth=5;
  ctx.stroke();
 }
 ctx.restore();

 // Botón de pausa
 ctx.save();
 ctx.globalAlpha=.7;
 circlePath(PB.x,PB.y,PB.r);
 ctx.fillStyle="#0b1322cc";
 ctx.fill();
 ctx.strokeStyle="#ffffffaa";
 ctx.lineWidth=2;
 ctx.stroke();
 ctx.fillStyle="white";
 ctx.fillRect(PB.x-7,PB.y-8,5,16);
 ctx.fillRect(PB.x+2,PB.y-8,5,16);
 ctx.restore();
}

function draw(){
 ctx.save();
 if(shakeT>0&&state==="playing"){
  let m=10*shakeT/.35;
  ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);
 }
 drawBackground();

 let inGame=["playing","levelcomplete","bosscomplete","paused","gameover"].includes(state)
  || (state==="shop"&&shopReturn!=="menu");

 if(inGame&&player){
  drawStar();
  drawEnemies();
  drawHazards();
  drawBoss();
  drawMinions();
  drawProjectiles();
  drawPlayer();
  drawGust();
  drawParticles();
  drawDarkness();

  ctx.fillStyle="#ffffffcc";
  ctx.font="bold 13px Arial";
  ctx.textAlign="right";
  ctx.fillText(
   isBossLevel()
    ? "DERROTA AL JEFE · estrellas y escudo le dañan"
    : "RECOGE "+starsNeeded()+" ESTRELLAS ("+collected+"/"+starsNeeded()+")",
   855,585
  );

  if(state==="playing")drawShieldBar();

  if(level===1&&state==="playing"){
   rounded(190,490,520,55,14,"#0b1322dd");
   ctx.fillStyle="white";
   ctx.font="bold 15px Arial";
   ctx.textAlign="center";
   ctx.fillText((isTouch?tutorialTouch:tutorial)[tutorialStep],450,523);
  }

  if(messageTimer>0&&state==="playing"){
   pill(message,450,142,20);
  }
 }

 if(inGame&&player){
  drawFloaters();
  drawEnemyBadge();
  drawHurt();
  drawBanner();
 }

 ctx.restore();

 if(isTouch&&state==="playing"&&player)drawTouchControls();

 if(state!=="playing")drawOverlay();
 else buttons=[];
}

function loop(time){
 let dt=Math.min((time-lastTime)/1000||0,.033);
 lastTime=time;
 clock+=dt;

 if(state!=="playing"&&joy.id!==null){joy.id=null;joy.dx=0;joy.dy=0;}
 if(shakeT>0)shakeT-=dt;
 if(hurtT>0)hurtT-=dt;
 if(bannerT>0&&state==="playing")bannerT-=dt;
 floaters.forEach(f=>f.t+=dt);
 floaters=floaters.filter(f=>f.t<1.1);

 if(state==="shop"&&messageTimer>0)messageTimer-=dt;

 update(dt);
 draw();
 updateProgressBar();
 requestAnimationFrame(loop);
}

/* ================== CONTROLES ================== */
document.addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)){
  e.preventDefault();
 }

 keys[e.key]=true;

 if(e.repeat)return;

 if(e.key==="Escape"){
  if(state==="playing")state="paused";
  else if(state==="paused")state="playing";
  else if(state==="shop")closeShop();
 }

 if(e.key===" "){
  useShield();
 }

 if(state==="shop"){
  if(e.key==="1")buyItem(0);
  if(e.key==="2")buyItem(1);
  if(e.key==="3")buyItem(2);
 }

 if(e.key==="Enter"){
  if(primaryAction&&state!=="playing")primaryAction();
 }
});

document.addEventListener("keyup",e=>{
 keys[e.key]=false;
});

window.addEventListener("blur",()=>{
 keys={};
 if(state==="playing")state="paused";
});

function canvasPos(e){
 let r=canvas.getBoundingClientRect();
 return {
  x:(e.clientX-r.left)*W/r.width,
  y:(e.clientY-r.top)*H/r.height
 };
}

canvas.addEventListener("mousemove",e=>{
 mouse=canvasPos(e);
 let over=buttons.some(b=>
  mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h
 );
 canvas.style.cursor=over?"pointer":"default";
});

canvas.addEventListener("mouseleave",()=>{
 mouse={x:-1,y:-1};
});

canvas.addEventListener("click",e=>{
 let m=canvasPos(e);

 for(const b of buttons){
  if(m.x>=b.x&&m.x<=b.x+b.w&&m.y>=b.y&&m.y<=b.y+b.h){
   b.action();
   break;
  }
 }
});

/* ================== CONTROLES TÁCTILES ================== */
let isTouch=typeof matchMedia!=="undefined"&&matchMedia("(pointer:coarse)").matches;
const joy={id:null,bx:0,by:0,dx:0,dy:0};
const JOY_X=120,JOY_Y=460,JOY_R=62;
const SB={x:790,y:455,r:50};
const PB={x:850,y:48,r:22};
const helpEl=document.getElementById("help");

function setTouchMode(){
 isTouch=true;
 helpEl.textContent="ARRASTRA A LA IZQUIERDA PARA MOVERTE · BOTÓN 🛡 = ESCUDO · ⏸ = PAUSA";
}
if(isTouch)setTouchMode();

canvas.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse")return;
 if(!isTouch)setTouchMode();
 if(state!=="playing")return;

 let m=canvasPos(e);

 if(Math.hypot(m.x-PB.x,m.y-PB.y)<PB.r+14){
  state="paused";
  return;
 }

 if(Math.hypot(m.x-SB.x,m.y-SB.y)<SB.r+14){
  useShield();
  return;
 }

 if(m.x<580&&joy.id===null){
  joy.id=e.pointerId;
  joy.bx=clamp(m.x,JOY_R+10,580);
  joy.by=clamp(m.y,170,540);
  joy.dx=0;
  joy.dy=0;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
 }
});

canvas.addEventListener("pointermove",e=>{
 if(e.pointerId!==joy.id)return;
 let m=canvasPos(e);
 let vx=m.x-joy.bx,vy=m.y-joy.by;
 let l=Math.hypot(vx,vy);
 if(l>JOY_R){vx=vx/l*JOY_R;vy=vy/l*JOY_R;}
 joy.dx=vx/JOY_R;
 joy.dy=vy/JOY_R;
});

function releaseJoy(e){
 if(e.pointerId!==joy.id)return;
 joy.id=null;
 joy.dx=0;
 joy.dy=0;
}
canvas.addEventListener("pointerup",releaseJoy);
canvas.addEventListener("pointercancel",releaseJoy);
canvas.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>e.preventDefault());

/* ================== AJUSTE A LA PANTALLA ================== */
function fit(){
 const game=document.querySelector(".game");
 for(let pass=0;pass<2;pass++){
  let used=0;
  for(const c of game.children){
   if(c===canvas)continue;
   let cs=getComputedStyle(c);
   if(cs.display==="none")continue;
   used+=c.offsetHeight+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0);
  }
  let pad=window.innerHeight<=520?8:24;
  let availW=Math.min(950,window.innerWidth-pad);
  let availH=window.innerHeight-used-pad-6;
  let w=Math.max(240,Math.min(availW,availH*1.5));
  canvas.style.width=w+"px";
  game.style.width=(w+pad)+"px";
 }
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",()=>setTimeout(fit,200));
document.addEventListener("fullscreenchange",()=>setTimeout(fit,200));
fit();

const fsBtn=document.getElementById("fs");
if(!document.documentElement.requestFullscreen)fsBtn.style.display="none";
fsBtn.addEventListener("click",()=>{
 if(document.fullscreenElement){document.exitFullscreen();return;}
 document.documentElement.requestFullscreen()
  .then(()=>screen.orientation.lock("landscape"))
  .catch(()=>{});
});

function initial(){
 updateUI();
 requestAnimationFrame(loop);
}

initial();
</script>
